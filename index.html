<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12294a">
<title>Descubre qué tienes cerca | Outlanders House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--navy:#12294a;--navy2:#1d4272;--teal:#3f7d76;--gold:#c4a15a;--cream:#f6f3ec;--ink:#1b2f4b;--muted:#64748b;--line:#e3dfd3;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--cream)}
header{background:linear-gradient(115deg,var(--navy),var(--navy2) 70%,#2f6a7a);color:#fff;padding:20px clamp(16px,4vw,42px);border-bottom:3px solid var(--gold)}
.row{display:flex;align-items:center;gap:18px;max-width:1300px;margin:auto}
.logo{width:74px;height:84px;background:#fff;border-radius:16px;padding:7px;display:grid;place-items:center;flex:none;box-shadow:0 6px 20px #0004}
.logo img{width:100%;height:100%;object-fit:contain}
.brand{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:clamp(24px,3.4vw,38px);margin:4px 0}
header p{margin:0;color:#d5e1f1;font-size:14px;line-height:1.5;max-width:620px}
.shell{display:grid;grid-template-columns:minmax(300px,380px) 1fr;max-width:1300px;margin:auto;height:calc(100vh - 128px);min-height:560px}
.side{padding:18px;overflow:auto}
.side h2{font-family:"Playfair Display",serif;font-size:21px;margin:0 0 4px}
.intro{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 12px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:14px;background:#fff;outline-color:var(--teal)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px}
.f{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font:600 12px Inter;color:var(--navy);cursor:pointer}
.f.on{background:var(--navy);border-color:var(--navy);color:#fff}
.list{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--teal));border-radius:14px;padding:13px;cursor:pointer;transition:.15s}
.card:hover,.card:focus{box-shadow:0 6px 20px #12294a18;outline:none;transform:translateY(-1px)}
.top{display:flex;gap:11px;align-items:center}
.ic{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,#fff);display:grid;place-items:center;font-size:20px;flex:none}
.card h3{margin:0;font-size:14px}
.cat{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--c)}
.card p{font-size:12.5px;line-height:1.5;color:var(--muted);margin:9px 0 0}
.acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:9px;padding:8px 11px;font:600 12px Inter;text-decoration:none;cursor:pointer;background:var(--navy);color:#fff;display:inline-block}
.btn.s{background:#eef2f1;color:var(--navy)}
#map{height:100%;min-height:420px;background:#e6ebee;border-left:1px solid var(--line)}
.leaflet-popup-content-wrapper{border-radius:14px}
.pop h3{margin:0 0 3px;font-family:"Playfair Display",serif;color:var(--navy);font-size:16px}
.pop p{margin:6px 0 9px;font-size:12.5px;line-height:1.45}
.pin{width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 3px 10px #0005;display:grid;place-items:center}
.pin span{transform:rotate(45deg);font-size:16px}
.pin.hotel{width:44px;height:44px;background:var(--gold)}
.empty{padding:18px;border:1px dashed #c6c0ae;border-radius:12px;color:var(--muted);font-size:13px}
footer{padding:14px;text-align:center;font-size:11px;color:var(--muted);background:#fff;border-top:1px solid var(--line)}
footer a{color:var(--teal)}
@media(max-width:780px){.row{align-items:flex-start}.logo{width:58px;height:66px}header p{font-size:13px}
.shell{display:flex;flex-direction:column-reverse;height:auto}.side{overflow:visible}#map{height:46vh;min-height:300px;border:0}}

/* Leaflet esencial (garantiza que los pines se posicionen bien aunque la hoja externa no cargue) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-marker-icon,.leaflet-tile-container{pointer-events:none}.leaflet-marker-icon.leaflet-interactive{pointer-events:auto;cursor:pointer}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}
.leaflet-bar{box-shadow:0 1px 5px #0006;border-radius:6px;overflow:hidden}.leaflet-bar a{display:block;width:30px;height:30px;line-height:30px;text-align:center;background:#fff;color:#000;border-bottom:1px solid #ccc;text-decoration:none;font:bold 18px/30px sans-serif}
.leaflet-control-attribution{background:#fffc;padding:0 5px;font-size:11px}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}.leaflet-popup-content-wrapper{padding:1px;text-align:left;background:#fff;box-shadow:0 3px 14px #0004}
.leaflet-popup-content{margin:13px 22px 13px 18px;line-height:1.3}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg);background:#fff}
.leaflet-popup-close-button{position:absolute;top:0;right:0;padding:4px 8px 0 0;font:16px/24px Tahoma;color:#757575;text-decoration:none;width:24px;height:24px;text-align:center}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
.lang{border:1px solid #ffffff80;background:#ffffff1c;color:#fff;border-radius:99px;padding:8px 14px;font:600 12px Inter;cursor:pointer;margin-left:auto;white-space:nowrap}
.lang:hover{background:#ffffff33}
#note{position:absolute;z-index:1200;left:12px;right:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted);box-shadow:0 4px 16px #0003}
.ph{position:relative;height:112px;border-radius:10px;overflow:hidden;margin-bottom:9px;background:linear-gradient(135deg,var(--c),#12294a);display:grid;place-items:center;font-size:34px}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mapwrap{position:relative;height:100%}
</style>
</head>
